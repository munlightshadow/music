<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Английский Маяк">
  <defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="96"/></clipPath>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#C19B4F"/>
      <stop offset="100%" stop-color="#F3D593" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C19B4F"/>
      <stop offset="100%" stop-color="#F3D593" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="#214149"/>
  <g clip-path="url(#disc)">
    <!-- gold beams from the lantern, as in the designer lockup -->
    <polygon points="100,56 0,38 0,76" fill="url(#beamL)"/>
    <polygon points="100,56 200,38 200,76" fill="url(#beamR)"/>
    <!-- water -->
    <path d="M0 142 C40 132 70 154 100 144 C130 134 160 154 200 142 L200 200 L0 200 Z" fill="#1A333A"/>
    <path d="M10 158 C42 150 72 168 100 158 C128 148 158 166 190 156" fill="none" stroke="#468A9D" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M22 170 C54 164 82 178 112 170 C142 162 164 176 182 168" fill="none" stroke="#A5D2DF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <!-- rocks -->
    <path d="M58 150 L70 136 L84 146 L100 130 L116 146 L132 134 L146 150 L134 160 L66 160 Z" fill="#1A333A"/>
    <path d="M72 150 L84 140 L100 148 L116 140 L128 150 L100 156 Z" fill="#214149"/>
    <!-- white lighthouse -->
    <path d="M87 154 L92 80 L108 80 L113 154 Z" fill="#FFFFFF"/>
    <rect x="95.5" y="92" width="9" height="11" fill="#214149"/>
    <rect x="95.5" y="112" width="9" height="11" fill="#214149"/>
    <rect x="84" y="76" width="32" height="7" fill="#FFFFFF"/>
    <rect x="86" y="74" width="28" height="3.2" fill="#A8B2BB"/>
    <!-- lantern + dark teal roof -->
    <rect x="91" y="55" width="18" height="19" fill="#F3D593"/>
    <rect x="93.5" y="57" width="5" height="15" fill="#FFFFFF" opacity="0.92"/>
    <rect x="101.5" y="57" width="5" height="15" fill="#FFFFFF" opacity="0.45"/>
    <polygon points="87,55 100,41 113,55" fill="#214149"/>
    <rect x="98" y="36" width="4" height="8" fill="#C19B4F"/>
  </g>
</svg>
